<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo digital</title><style>
:root{--c:#7c3aed;--bg:#f6f5fb;--ink:#202124;--muted:#6b7280;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--ink)}header{background:linear-gradient(120deg,#5b21b6,var(--c));color:white;padding:28px 20px}main{max-width:1100px;margin:auto;padding:20px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.bar input,.bar select,input,textarea,select{padding:11px;border:1px solid var(--line);border-radius:9px;background:white;font:inherit}input,textarea,select{width:100%}button{border:0;border-radius:9px;padding:10px 14px;background:var(--c);color:white;font-weight:700;cursor:pointer}button.secondary{background:#ede9fe;color:#5b21b6}button.danger{background:#fee2e2;color:#991b1b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:18px}.card,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 3px 12px #00000008}.card h3{margin:8px 0}.price{font-size:20px;font-weight:800;color:var(--c)}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:1fr 320px;gap:20px}@media(max-width:800px){.layout{grid-template-columns:1fr}}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.hidden{display:none}.tag{background:#ede9fe;color:#5b21b6;padding:5px 9px;border-radius:99px;font-size:12px}.admin{margin-top:24px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}h1{margin:0 0 6px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center}
</style></head><body><header><main><div class="hero"><div><h1>🛍️ Catálogo digital</h1><p>Elegí tus productos y enviá tu pedido al negocio.</p></div><button class="secondary" onclick="toggleAdmin()">⚙️ Administrar</button></div></main></header><main><div class="bar"><input id="search" placeholder="Buscar productos..." oninput="render()"><select id="cat" onchange="render()"><option value="">Todas las categorías</option></select></div><div class="layout"><section><div id="products" class="grid"></div></section><aside class="panel"><h2>🧺 Tu pedido</h2><div id="cart"></div><hr><div class="row"><b>Total</b><b id="total">$0</b></div><h3>Datos para el pedido</h3><input id="customer" placeholder="Tu nombre"><br><br><input id="phone" placeholder="WhatsApp o teléfono"><br><br><textarea id="note" placeholder="Observaciones" rows="3"></textarea><br><br><button onclick="order()">Hacer pedido</button><p id="msg" class="muted"></p></aside></div><section id="admin" class="admin hidden panel"><h2>⚙️ Panel del dueño</h2><form onsubmit="addProduct(event)" class="formgrid"><input id="newName" required placeholder="Producto"><input id="newPrice" required type="number" min="0" placeholder="Precio"><input id="newCat" required placeholder="Categoría"><button>Agregar producto</button></form><div id="adminList"></div></section></main><script>
const key='catalogo-products';let products=JSON.parse(localStorage.getItem(key)||'null')||[{id:1,name:'Hamburguesa clásica',price:6500,cat:'Comidas',active:true},{id:2,name:'Papas caseras',price:2800,cat:'Acompañamientos',active:true},{id:3,name:'Limonada',price:2200,cat:'Bebidas',active:true},{id:4,name:'Combo familiar',price:14500,cat:'Combos',active:true}];let cart={};const money=n=>'$'+Number(n).toLocaleString('es-AR');function save(){localStorage.setItem(key,JSON.stringify(products))}function render(){let q=document.getElementById('search').value.toLowerCase(),c=document.getElementById('cat').value;let cats=[...new Set(products.map(p=>p.cat))];document.getElementById('cat').innerHTML='<option value="">Todas las categorías</option>'+cats.map(x=>`<option ${x===c?'selected':''}>${x}</option>`).join('');let list=products.filter(p=>p.active&&(!c||p.cat===c)&&p.name.toLowerCase().includes(q));document.getElementById('products').innerHTML=list.map(p=>`<article class="card"><span class="tag">${p.cat}</span><h3>${p.name}</h3><p class="muted">Producto disponible para pedido.</p><div class="row"><span class="price">${money(p.price)}</span><button onclick="add(${p.id})">Agregar</button></div></article>`).join('')||'<p>No hay productos para mostrar.</p>';renderCart();renderAdmin()}function add(id){cart[id]=(cart[id]||0)+1;renderCart()}function change(id,n){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];renderCart()}function renderCart(){let ids=Object.keys(cart);document.getElementById('cart').innerHTML=ids.length?ids.map(id=>{let p=products.find(x=>x.id==id);return `<div class="row"><span>${p.name}<br><small>${money(p.price)} × ${cart[id]}</small></span><span><button class="secondary" onclick="change(${id},-1)">−</button> <button class="secondary" onclick="change(${id},1)">+</button></span></div>`}).join(''):'<p class="muted">Todavía no agregaste productos.</p>';let t=ids.reduce((s,id)=>s+products.find(p=>p.id==id).price*cart[id],0);document.getElementById('total').textContent=money(t)}function order(){let ids=Object.keys(cart);if(!ids.length)return alert('Agregá al menos un producto.');if(!document.getElementById('customer').value)return alert('Completá tu nombre.');let order={number:Date.now().toString().slice(-6),customer:document.getElementById('customer').value,items:ids.map(id=>({name:products.find(p=>p.id==id).name,qty:cart[id]})),total:document.getElementById('total').textContent,date:new Date().toLocaleString('es-AR')};let orders=JSON.parse(localStorage.getItem('catalogo-orders')||'[]');orders.push(order);localStorage.setItem('catalogo-orders',JSON.stringify(orders));cart={};renderCart();document.getElementById('msg').textContent='Pedido #'+order.number+' enviado correctamente ✅'}function toggleAdmin(){document.getElementById('admin').classList.toggle('hidden')}function addProduct(e){e.preventDefault();products.push({id:Date.now(),name:newName.value,price:+newPrice.value,cat:newCat.value,active:true});save();e.target.reset();render()}function toggle(id){let p=products.find(x=>x.id==id);p.active=!p.active;save();render()}function editPrice(id){let p=products.find(x=>x.id==id),v=prompt('Nuevo precio',p.price);if(v!==null){p.price=+v;save();render()}}function renderAdmin(){let box=document.getElementById('adminList');if(!box)return;box.innerHTML=products.map(p=>`<div class="row"><span>${p.active?'🟢':'🔴'} ${p.name} — ${money(p.price)}</span><span><button class="secondary" onclick="editPrice(${p.id})">Precio</button> <button class="secondary" onclick="toggle(${p.id})">${p.active?'Desactivar':'Activar'}</button></span></div>`).join('')}render();
</script></body></html>
